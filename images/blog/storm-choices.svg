<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Three responses to a storm: face it with preparation, move to shelter, or avoid purely to escape a feeling you could learn to tolerate.">
<rect width="900" height="300" rx="14" fill="#eef3f5"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#263a46" text-anchor="middle">
<text x="450" y="40" font-size="20" font-weight="bold">Three ways to meet a storm</text>
<rect x="30" y="65" width="260" height="200" rx="14" fill="#c5d7de"/><text x="160" y="105" font-size="19" font-weight="bold">Face it — prepared</text><text x="160" y="140" font-size="15">Safe, useful, and a small</text><text x="160" y="162" font-size="15">experiment lets you learn</text><text x="160" y="184" font-size="15">something avoidance hides.</text><text x="160" y="230" font-size="14" fill="#5b7384">e.g. ask one clear question</text>
<rect x="320" y="65" width="260" height="200" rx="14" fill="#d5e3d3"/><text x="450" y="105" font-size="19" font-weight="bold">Seek shelter</text><text x="450" y="140" font-size="15">Real danger, exhaustion, or</text><text x="450" y="162" font-size="15">you need support first.</text><text x="450" y="184" font-size="15">Stepping back can be wise.</text><text x="450" y="230" font-size="14" fill="#5b7384">e.g. rest, get help, return later</text>
<rect x="610" y="65" width="260" height="200" rx="14" fill="#e8d9c0"/><text x="740" y="105" font-size="19" font-weight="bold">Avoid the feeling</text><text x="740" y="140" font-size="15">Protects you from a feeling</text><text x="740" y="162" font-size="15">you could safely learn to</text><text x="740" y="184" font-size="15">tolerate — not from harm.</text><text x="740" y="230" font-size="14" fill="#5b7384">e.g. never opening the bill</text></g></svg>
